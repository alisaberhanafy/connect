<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eff7ff"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./assets/fonts/fonts.css"><title>إشعارات كونكت | كونكت واي فاي</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#edf7ff,#f9fbff);color:#10284b;font-family:"Cairo","Tajawal",Tahoma,sans-serif}.page{width:min(900px,calc(100% - 32px));margin:auto;padding:22px 0 45px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:11px}.ico{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(145deg,#087fe0,#13c5e4);color:white;font-size:23px}.brand strong{font-size:18px;font-weight:950}.brand small{display:block;color:#647b96;font-size:11px}.back{padding:11px 15px;border:1px solid #dbe7f2;border-radius:13px;background:#fff;color:#15518a;text-decoration:none;font-size:13px;font-weight:900}.hero{padding:27px;border-radius:24px;background:linear-gradient(120deg,#071c51,#0c3d89 65%,#087bb1);color:#fff;box-shadow:0 18px 40px #0b2c6628}.hero h1{font-size:32px;margin:0 0 6px}.hero p{margin:0;color:#d7eaff;font-size:14px;line-height:1.9}.list{display:grid;gap:12px;margin-top:20px}.item{padding:18px;border:1px solid #dce8f2;border-radius:18px;background:#fff;box-shadow:0 8px 22px #1b47700b}.item-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.item h2{font-size:17px;margin:0;font-weight:950}.date{font-size:11px;color:#6b8099;white-space:nowrap}.item p{font-size:13px;line-height:1.9;color:#526984;margin:9px 0 0}.tag{display:inline-block;margin-top:10px;padding:5px 10px;border-radius:20px;background:#e8f4ff;color:#0875bd;font-size:11px;font-weight:900}.tag.alert{background:#fff1e5;color:#b65a21}.tag.maintenance{background:#f0ebff;color:#7655c6}.empty{padding:24px;text-align:center;border:1px dashed #cbdce9;border-radius:17px;background:#fff;color:#647b96;font-size:14px;line-height:2}.footer{text-align:center;color:#8495a9;font-size:12px;padding-top:25px}@media(max-width:520px){.page{padding-top:13px}.hero{padding:22px 19px}.hero h1{font-size:27px}.item{padding:15px}.item h2{font-size:15px}.item p{font-size:12px}.date{font-size:10px}}
</style></head><body><main class="page"><header class="top"><div class="brand"><span class="ico">♧</span><span><strong>كونكت واي فاي</strong><small>الأخبار والتنبيهات</small></span></div><a class="back" href="./index.html">⌂ الرئيسية</a></header><section class="hero"><h1>إشعارات كونكت</h1><p>تابع آخر أخبار الخدمة والتنبيهات والصيانة وأي تحديثات مهمة تخص اشتراكك.</p></section><section id="list" class="list"><div class="empty">جاري تحميل الإشعارات…</div></section><footer class="footer">كونكت واي فاي · نحرص على إبقائك على اطلاع</footer></main><script>
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const date=v=>{if(!v)return "";const d=new Date(v);return Number.isNaN(d.getTime())?"":new Intl.DateTimeFormat("ar-EG",{day:"numeric",month:"short",year:"numeric"}).format(d)};
(async()=>{const list=document.getElementById("list");try{const r=await fetch("./notifications.json?v="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error();const raw=await r.json(),items=Array.isArray(raw)?raw:(raw.items||[]);if(!items.length){list.innerHTML='<div class="empty">لا توجد إشعارات منشورة حاليًا.<br>تابعنا لمعرفة آخر أخبار وخدمات كونكت.</div>';return}const names={news:"خبر",alert:"تنبيه",maintenance:"صيانة"};list.innerHTML=items.map(x=>{const type=names[x.type]||"خبر";const cls=x.type==="alert"?"alert":x.type==="maintenance"?"maintenance":"";return `<article class="item"><div class="item-top"><h2>${esc(x.title||"إشعار من كونكت")}</h2><time class="date">${esc(date(x.date))}</time></div><p>${esc(x.message||"")}</p><span class="tag ${cls}">${type}</span></article>`}).join("")}catch(e){list.innerHTML='<div class="empty">تعذر تحميل الإشعارات الآن. تحقق من اتصال الإنترنت وحاول مرة أخرى.</div>'}})();
</script></body></html>
