<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f6fb">
  <meta name="description" content="بوابة كونكت واي فاي للخدمات وإدارة الاشتراكات.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>كونكت واي فاي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      color-scheme:light;
      --page:#f3f6fb;--surface:#fff;--ink:#142238;--muted:#64748b;
      --line:#dce5f0;--blue:#078bff;--blue-soft:#e5f2ff;
      --shadow:0 8px 22px rgba(25,48,78,.055);
    }
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100svh;padding:20px 16px 34px;
      background:var(--page);color:var(--ink);
      font-family:"Cairo",system-ui,sans-serif;
      transition:background .2s,color .2s;
    }
    .wrap{width:min(100%,560px);margin:0 auto}
    .hero{
      position:relative;background:var(--surface);border:1px solid var(--line);
      border-radius:25px;box-shadow:var(--shadow);min-height:208px;
      padding:23px 20px 20px;text-align:center;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
    }
    .brand-logo{
      width:91px;height:91px;object-fit:contain;border-radius:22px;
      background:#fff;box-shadow:0 5px 17px rgba(0,126,220,.12);
      margin:0 0 13px;
    }
    .brand-title{font-size:23px;line-height:1.45;font-weight:900;margin:0 0 2px}
    .brand-subtitle{font-size:13px;color:var(--muted);margin:0}
    .theme-toggle{
      position:absolute;top:16px;left:16px;width:41px;height:41px;
      display:grid;place-items:center;border:2px solid #f0a000;
      border-radius:13px;background:var(--surface);color:var(--ink);
      cursor:pointer;padding:0;
    }
    .theme-toggle svg{width:21px;height:21px}
    .links{display:grid;gap:12px;margin-top:20px}
    .portal{
      min-height:86px;display:grid;grid-template-columns:44px minmax(0,1fr) 24px;
      align-items:center;gap:13px;padding:12px 15px;
      text-decoration:none;color:var(--ink);background:var(--surface);
      border:1px solid var(--line);border-radius:19px;box-shadow:var(--shadow);
      transition:transform .18s,border-color .18s,box-shadow .18s;
    }
    .portal:hover{transform:translateY(-2px);border-color:#b9d9f7;box-shadow:0 10px 25px rgba(25,48,78,.09)}
    .portal:focus-visible,.theme-toggle:focus-visible,.install:focus-visible,.whatsapp:focus-visible{
      outline:3px solid #80c4ff;outline-offset:3px
    }
    .portal-icon{
      width:44px;height:44px;border-radius:13px;background:var(--blue-soft);
      color:var(--blue);display:grid;place-items:center;
    }
    .portal-icon svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
    .portal-copy{text-align:right;min-width:0;display:block;overflow:hidden}
    .portal-title{display:block;font-size:16px;font-weight:800;line-height:1.55;margin:0 0 2px;white-space:normal}
    .portal-desc{display:block;font-size:11.5px;color:var(--muted);line-height:1.65;margin:0;white-space:normal;overflow-wrap:anywhere}
    .arrow{color:#71839b;display:grid;place-items:center}
    .arrow svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .actions{display:flex;justify-content:center;margin:22px 0 0}
    .install{
      display:inline-flex;align-items:center;justify-content:center;gap:7px;
      border:1px solid #078bff55;background:#e8f4ff;color:#0875cf;
      border-radius:13px;padding:10px 17px;font:800 13px "Cairo",sans-serif;cursor:pointer;
    }

    .support-cta{
      width:100%;min-height:50px;margin-top:20px;padding:11px 16px;
      display:flex;align-items:center;justify-content:center;gap:9px;
      border:0;border-radius:16px;background:#20c968;color:#fff;
      text-decoration:none;font:800 14px "Cairo",sans-serif;
      box-shadow:0 7px 17px rgba(32,201,104,.20);
      transition:transform .18s,background .18s;
    }
    .support-cta:hover{background:#18b95d;transform:translateY(-1px)}
    .support-cta svg{width:22px;height:22px;fill:currentColor;flex:none}
    .footer{text-align:center;color:#8794a5;font-size:11px;margin-top:25px}
    .whatsapp{
      position:fixed;left:17px;bottom:17px;width:53px;height:53px;border-radius:50%;
      background:#20bd66;color:#fff;display:grid;place-items:center;
      box-shadow:0 7px 22px rgba(32,189,102,.28);z-index:5;text-decoration:none;
    }
    .whatsapp svg{width:29px;height:29px;fill:currentColor}
    .toast{
      position:fixed;left:50%;bottom:82px;transform:translateX(-50%);
      width:max-content;max-width:calc(100% - 30px);padding:10px 14px;
      background:#142238;color:#fff;border-radius:12px;font-size:12px;
      text-align:center;display:none;z-index:10;box-shadow:var(--shadow)
    }
    .toast.show{display:block}
    body.dark{
      color-scheme:dark;--page:#111b2b;--surface:#1b2a40;--ink:#f1f6fc;
      --muted:#a6b5c9;--line:#2b3d55;--blue:#55adff;--blue-soft:#233e5d;
      --shadow:0 8px 22px rgba(0,0,0,.15);
    }
    body.dark .brand-logo{background:#fff}
    body.dark .install{background:#203c59;color:#a9d7ff;border-color:#3d6286}
    body.dark .theme-toggle{border-color:#6f86a4}
    @media(min-width:700px){
      body{display:flex;align-items:center;justify-content:center;padding:32px 20px}
      .wrap{width:min(100%,540px)}
      .hero{min-height:220px}
      .links{gap:13px;margin-top:21px}
      .portal{min-height:82px}
    }
    @media(max-width:380px){
      .hero{min-height:195px;padding-top:21px}
      .brand-logo{width:82px;height:82px}
      .portal{grid-template-columns:42px minmax(0,1fr) 20px;gap:10px;padding:11px 12px}
      .portal-title{font-size:15px}
      .portal-desc{font-size:10.5px}
    }
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="تفعيل الوضع الليلي" title="تغيير المظهر">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.7 8.7 0 1 0 20.5 14.2Z"/></svg>

        <span class="arrow"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></span>

  <a class="support-cta" href="https://wa.me/201064225132?text=%D8%A3%D9%87%D9%84%D8%A7%20%D9%83%D9%88%D9%86%D9%83%D8%AA%D8%8C%20%D9%85%D8%AD%D8%AA%D8%A7%D8%AC%20%D9%85%D8%B3%D8%A7%D8%B9%D8%AF%D8%A9%20%D8%B9%D9%84%D9%89%20%D8%A8%D8%A7%D9%82%D8%AA%D9%8A%20%D8%B9%D9%84%D9%89%20%D8%B1%D9%82%D9%85%3A%20" target="_blank" rel="noopener noreferrer">

    <div class="actions">
      <button class="install" id="installBtn" type="button">＋ تثبيت التطبيق</button>

    <footer class="footer">© <span id="year"></span> كونكت واي فاي — اتصال أسهل وإدارة أبسط</footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    themeToggle.addEventListener('click', () => {
      const dark = document.body.classList.toggle('dark');
      themeToggle.setAttribute('aria-label', dark ? 'تفعيل الوضع النهاري' : 'تفعيل الوضع الليلي');
      themeIcon.innerHTML = dark
        ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>'
        : '<path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.7 8.7 0 1 0 20.5 14.2Z"/>';
    });

    const installBtn = document.getElementById('installBtn');
    const toast = document.getElementById('toast');
    let installPrompt = null;
    function showToast(message) {
      toast.textContent = message; toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 6000);
    }
    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault(); installPrompt = event;
    });
    installBtn.addEventListener('click', async () => {
      if (installPrompt) {
        installPrompt.prompt();
        await installPrompt.userChoice;
        installPrompt = null;
      } else if (/iphone|ipad|ipod/i.test(navigator.userAgent)) {
        showToast('على آيفون: اضغط مشاركة في Safari ثم «إضافة إلى الشاشة الرئيسية».');
      } else if (/android/i.test(navigator.userAgent)) {
        showToast('من قائمة Chrome ⋮ اختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».');
      } else {
        showToast('من قائمة Chrome أو Edge اختر «تثبيت كونكت واي فاي».');
      }
    });
    window.addEventListener('appinstalled', () => showToast('تم تثبيت كونكت واي فاي على جهازك.'));
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  </script>
