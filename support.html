<!doctype html>
<html lang="ar" dir="rtl">
<head>
<style>@font-face{font-family:"Connect Arabic";src:url("./fonts/connect-arabic-regular.ttf") format("truetype");font-weight:400;font-display:swap}@font-face{font-family:"Connect Arabic";src:url("./fonts/connect-arabic-semibold.ttf") format("truetype");font-weight:600;font-display:swap}@font-face{font-family:"Connect Arabic";src:url("./fonts/connect-arabic-black.ttf") format("truetype");font-weight:800;font-display:swap}body{font-family:"Connect Arabic",Tahoma,sans-serif}</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#109b87">
<title>خدمة عملاء كونكت واي فاي</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#e9f7f5,#f4f8fc 58%,#e9f2fb);font-family:Tahoma,Arial,sans-serif;color:#17334a}
.card{width:min(100%,430px);padding:30px 24px;text-align:center;background:#fff;border:1px solid #dce9ed;border-radius:25px;box-shadow:0 18px 48px rgba(28,74,92,.12)}
.icon{width:68px;height:68px;margin:0 auto 16px;display:grid;place-items:center;border-radius:21px;background:#e6f7f3;color:#079b83;font-size:32px}
h1{font-size:21px;margin:0 0 10px;font-weight:900}p{font-size:14px;line-height:1.9;color:#708596;margin:0 0 22px}
a{display:flex;min-height:50px;align-items:center;justify-content:center;border-radius:14px;background:linear-gradient(135deg,#12a58d,#07866f);color:#fff;text-decoration:none;font-weight:800;font-size:15px;box-shadow:0 8px 18px rgba(8,145,125,.18)}
.small{font-size:11px;color:#93a3af;margin-top:15px}.loader{width:22px;height:22px;margin:0 auto 14px;border:3px solid #d9eee8;border-top-color:#0b9b83;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.loader{animation:none}}
</style>
</head>
<body>
<main class="card">
 <div class="icon" aria-hidden="true">💬</div><div class="loader" aria-hidden="true"></div>
 <h1>جاري تحويلك إلى صفحة خدمة العملاء</h1>
 <p>لو الصفحة مفتحتش تلقائي، اضغط على الزرار علشان تتواصل مع خدمة عملاء كونكت.</p>
 <a id="supportLink" href="https://tawk.to/chat/666fbdbd9a809f19fb3e829f/1i0i7qbe6">فتح خدمة العملاء</a>
 <div class="small">كونكت واي فاي — دعم ومساعدة</div>
</main>
<script>
(()=>{const url="https://tawk.to/chat/666fbdbd9a809f19fb3e829f/1i0i7qbe6";document.getElementById("supportLink").href=url;window.setTimeout(()=>window.location.replace(url),1600)})();
</script>
</body></html>
