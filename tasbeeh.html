<style>
*{box-sizing:border-box}html{min-height:100%;scroll-behavior:smooth}body{margin:0;min-height:100vh;font-family:"Cairo",Tahoma,sans-serif;color:var(--text);background:var(--bg);padding-bottom:calc(22px + env(safe-area-inset-bottom));transition:background .25s,color .25s}
:root{--bg:#eff7ff;--panel:#fff;--text:#142846;--muted:#687b94;--line:#dce8f2;--accent:#087fc7;--accent2:#39bce8;--support:#119b66;--shadow:0 8px 25px rgba(22,75,119,.08)}
body[data-theme="sky"]{--bg:#eaf6ff;--panel:rgba(255,255,255,.94);--text:#102b52;--muted:#607b9e;--line:#cfe6f4;--accent:#0789d4;--accent2:#42c9f2;background:linear-gradient(160deg,#dff2ff,#f7fbff 55%,#e8f5ff)}
body[data-theme="neon"]{--bg:#061326;--panel:rgba(7,25,48,.94);--text:#f3f9ff;--muted:#9db7d2;--line:rgba(40,180,255,.28);--accent:#00c8ff;--accent2:#7a64ff;--support:#08c98b;background:radial-gradient(ellipse at 50% 0%,#073d69,transparent 45%),#041022}
body[data-theme="waves"]{--bg:#090e35;--panel:rgba(20,25,75,.94);--text:#fff;--muted:#c1c5e9;--line:rgba(130,115,255,.3);--accent:#ff5fc8;--accent2:#32d9ff;--support:#16c98b;background:radial-gradient(ellipse at 10% 80%,rgba(239,52,180,.22),transparent 38%),#080d31}
body[data-theme="minimal"]{--bg:#f4f6fa;--panel:#fff;--text:#192b43;--muted:#718096;--line:#e4eaf1;--accent:#1769aa;--accent2:#36a8cf;--support:#16875e;background:#f4f6fa}
body[data-theme="desert"]{--bg:#f9efe0;--panel:rgba(255,250,241,.96);--text:#422d21;--muted:#876b53;--line:rgba(133,83,43,.2);--accent:#c56a25;--accent2:#e7a34c;--support:#21865b;background:linear-gradient(160deg,#f5dfc1,#fff8ed 65%,#efd8b7)}
body[data-theme="cyber"]{--bg:#10082d;--panel:rgba(28,15,67,.95);--text:#fff;--muted:#c6b8e8;--line:rgba(171,105,255,.32);--accent:#20d9ff;--accent2:#bd4cff;--support:#18d18b;background:radial-gradient(ellipse at 80% 0%,#42106a,transparent 40%),#0b0623}
.bg-art{position:fixed;inset:0;z-index:-1;pointer-events:none;background-position:center top;background-size:cover;opacity:.19}
body[data-theme="sky"] .bg-art{background-image:url("./backgrounds/sky.svg")}
body[data-theme="neon"] .bg-art{background-image:url("./backgrounds/neon.svg");opacity:.35}
body[data-theme="waves"] .bg-art{background-image:url("./backgrounds/waves.svg");opacity:.42}
body[data-theme="minimal"] .bg-art{background-image:url("./backgrounds/minimal.svg");opacity:.28}
body[data-theme="desert"] .bg-art{background-image:url("./backgrounds/desert.svg");opacity:.35}
body[data-theme="cyber"] .bg-art{background-image:url("./backgrounds/cyber.svg");opacity:.4}
.app{width:min(100% - 28px,540px);margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 0 10px}
.topbar{height:54px;display:flex;align-items:center;justify-content:space-between;gap:12px}

.brand-name{font-size:16px;font-weight:900;line-height:1.3}.brand-sub{font-size:9px;letter-spacing:.8px;color:var(--muted)}

.top-actions{display:flex;align-items:center;gap:8px}
.header-action svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.header-action{display:grid;place-items:center}
.header-action:active{transform:scale(.94)}
@media(max-width:420px){.top-actions{gap:6px}.header-action,.top-actions .round-btn{width:38px;height:38px;min-width:38px}}
.top-actions{display:flex;gap:7px}.round-btn{width:38px;height:38px;border-radius:13px;border:1px solid var(--line);background:var(--panel);color:var(--text);display:grid;place-items:center;font-size:17px;cursor:pointer}
/* V23: compact five-item navigation — all shortcuts visible without horizontal scrolling */
.quick-nav{position:sticky;top:6px;z-index:15;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin:9px 0 14px;padding:6px;border:1px solid var(--line);border-radius:16px;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 5px 18px rgba(22,75,119,.06)}
.quick-nav a{min-width:0;min-height:55px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:5px 1px;border-radius:11px;text-decoration:none;color:var(--text);background:transparent;border:1px solid transparent;font-size:clamp(7px,2.05vw,9px);font-weight:800;line-height:1.25;white-space:nowrap;text-align:center;transition:background .2s,border-color .2s,transform .2s}
.quick-nav a:hover,.quick-nav a:focus-visible{background:color-mix(in srgb,var(--accent) 8%,var(--panel));border-color:color-mix(in srgb,var(--accent) 18%,var(--line));outline:none}
.quick-nav a:active{transform:scale(.95)}.quick-nav .quick-icon{width:25px;height:25px;display:grid;place-items:center;border-radius:8px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));color:var(--accent)}
.quick-nav .quick-icon svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}

@media(min-width:700px){.quick-nav{margin:10px 0 18px;gap:8px;padding:7px}.quick-nav a{min-height:58px;font-size:11px;gap:5px}.quick-nav .quick-icon{width:27px;height:27px}}
@media(min-width:700px){.quick-nav{margin:10px 0 18px;justify-content:center}.quick-nav a{font-size:11px;padding:9px 14px}}
.hero{position:relative;margin:17px 0 19px;padding:23px 19px 21px;border-radius:23px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.hero:after{content:"";position:absolute;width:155px;height:155px;border-radius:50%;border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);left:-64px;top:-90px;box-shadow:0 0 0 17px color-mix(in srgb,var(--accent) 5%,transparent),0 0 0 36px color-mix(in srgb,var(--accent) 3%,transparent)}
.eyebrow{display:inline-flex;align-items:center;gap:7px;color:var(--accent);font-size:10px;font-weight:800}.live-dot{width:7px;height:7px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent2) 14%,transparent)}
h1{font-size:clamp(26px,7vw,34px);font-weight:900;line-height:1.45;margin:9px 0 4px;letter-spacing:-.4px}
h1 span{color:var(--accent)}.hero p{font-size:11px;line-height:1.9;color:var(--muted);margin:0;max-width:340px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}.section-title h2{font-size:14px;font-weight:900;margin:0}.section-title span{font-size:9px;color:var(--muted)}
.services{display:grid;grid-template-columns:1fr;gap:10px}
.service{min-height:90px;display:flex;align-items:center;gap:13px;padding:13px 14px;border-radius:18px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);text-decoration:none;color:var(--text);transition:transform .2s,border-color .2s;position:relative;overflow:hidden}
.service:active{transform:scale(.985)}.service:hover{border-color:var(--accent)}
.service-icon{width:53px;height:53px;flex:none;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 12%,var(--panel));color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 17%,transparent)}
.service-icon svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.service-copy{flex:1;min-width:0}.service h3{font-size:15px;font-weight:900;margin:0 0 2px;line-height:1.55}.service p{font-size:10px;line-height:1.7;color:var(--muted);margin:0}
.go{width:34px;height:34px;flex:none;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 9%,var(--panel));color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 18%,var(--line));transition:transform .22s,background .22s,border-color .22s}.go svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.service:hover .go{transform:translateX(-3px);background:color-mix(in srgb,var(--accent) 16%,var(--panel));border-color:var(--accent)}.service:active .go{transform:scale(.92)}
.service.agent .service-icon{--accent:#8265d8;color:#8265d8;background:color-mix(in srgb,#8265d8 12%,var(--panel))}
.service.admin .service-icon{--accent:#e46b48;color:#e46b48;background:color-mix(in srgb,#e46b48 12%,var(--panel))}
.support{margin-top:15px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 13px;border-radius:17px;background:color-mix(in srgb,var(--support) 9%,var(--panel));border:1px solid color-mix(in srgb,var(--support) 25%,var(--line))}
.support-copy{display:flex;align-items:center;gap:9px;min-width:0}.wa{width:39px;height:39px;flex:none;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--support) 17%,var(--panel));color:var(--support);font-size:20px}
.support h3{font-size:12px;margin:0;font-weight:900}.support p{font-size:9px;margin:1px 0 0;color:var(--muted)}
.support-link{padding:9px 11px;border-radius:11px;background:var(--support);color:#fff;text-decoration:none;font-size:10px;font-weight:900;white-space:nowrap}
.tools{display:flex;justify-content:center;gap:9px;margin:13px 0 0}.tool-btn{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:12px;padding:9px 12px;font:700 10px "Cairo",sans-serif;cursor:pointer}
.tool-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.footer{text-align:center;font-size:9px;color:var(--muted);padding:17px 0 5px}
.sheet-backdrop{position:fixed;inset:0;background:rgba(3,14,30,.48);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:21;bottom:0;left:0;right:0;max-height:min(78vh,680px);overflow:auto;padding:12px 18px calc(20px + env(safe-area-inset-bottom));background:var(--panel);color:var(--text);border-radius:24px 24px 0 0;border:1px solid var(--line);box-shadow:0 -12px 45px rgba(0,0,0,.18);transform:translateY(105%);transition:transform .3s ease}
.sheet.open{transform:translateY(0)}.handle{width:42px;height:4px;border-radius:5px;background:var(--muted);opacity:.35;margin:0 auto 14px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.sheet-head h2{font-size:16px;margin:0}.close{border:0;background:transparent;color:var(--muted);font-size:24px}
.theme-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.theme-option{border:2px solid var(--line);border-radius:13px;padding:6px;background:var(--panel);color:var(--text);text-align:right;cursor:pointer;min-width:0}
.theme-option[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 12%,transparent)}
.swatch{height:65px;border-radius:8px;background-size:cover;background-position:center;margin-bottom:6px}
.theme-option[data-theme-choice="sky"] .swatch{background-image:url("./backgrounds/sky.svg")}
.theme-option[data-theme-choice="neon"] .swatch{background-image:url("./backgrounds/neon.svg")}
.theme-option[data-theme-choice="waves"] .swatch{background-image:url("./backgrounds/waves.svg")}
.theme-option[data-theme-choice="minimal"] .swatch{background-image:url("./backgrounds/minimal.svg")}
.theme-option[data-theme-choice="desert"] .swatch{background-image:url("./backgrounds/desert.svg")}
.theme-option[data-theme-choice="cyber"] .swatch{background-image:url("./backgrounds/cyber.svg")}
.theme-option strong{font-size:10px;display:block}.theme-option small{font-size:8px;color:var(--muted)}
.toast{position:fixed;z-index:30;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:#15243b;color:#fff;border-radius:10px;padding:11px 15px;font-size:11px;transition:.25s;max-width:calc(100% - 28px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* V17: animated Arabic display headline + responsive support CTA */
.hero-title{
 font-family:"Alexandria","Cairo",sans-serif;
 font-size:clamp(31px,8vw,43px);
 font-weight:400;
 line-height:1.35;
 letter-spacing:.1px;
 margin:8px 0 1px;
 color:var(--text);
 text-shadow:0 3px 16px color-mix(in srgb,var(--accent) 14%,transparent);
}
.type-line{
 font-family:"Tajawal","Cairo",sans-serif;
 font-weight:800;
 min-height:42px;
 display:flex;
 align-items:center;
 justify-content:center;
 gap:4px;
 direction:rtl;
 color:var(--accent);
 font-size:clamp(23px,6vw,31px);
 line-height:1.55;
 margin:0 0 7px;
}
.type-cursor{
 display:inline-block;
 width:2px;
 height:1.05em;
 border-radius:2px;
 background:var(--accent2);
 box-shadow:0 0 9px var(--accent2);
 animation:cursorBlink .75s steps(2,start) infinite;
}
@keyframes cursorBlink{to{visibility:hidden}}
.support-link{
 position:relative;
 isolation:isolate;
 transform-origin:center;
 animation:supportBounce 2.8s ease-in-out infinite;
 box-shadow:0 7px 18px color-mix(in srgb,var(--support) 24%,transparent);
}
.support-link:before{
 content:"";
 position:absolute;
 inset:-4px;
 z-index:-1;
 border:1px solid color-mix(in srgb,var(--support) 42%,transparent);
 border-radius:14px;
 opacity:0;
 animation:supportRipple 2.8s ease-out infinite;
}
.support-link:active{transform:scale(.94);animation:none}
.support-link:hover{animation-play-state:paused;filter:brightness(1.07)}
@keyframes supportBounce{
 0%,72%,100%{transform:translateY(0) scale(1)}
 78%{transform:translateY(-4px) scale(1.025)}
 84%{transform:translateY(0) scale(.99)}
 90%{transform:translateY(-2px) scale(1.01)}
}
@keyframes supportRipple{
 0%,65%{transform:scale(.96);opacity:0}
 73%{opacity:.55}
 100%{transform:scale(1.16);opacity:0}
}
@media(prefers-reduced-motion:reduce){
 .support-link,.support-link:before,.type-cursor{animation:none!important}
}


/* V19: customer announcements and current offers */
.content-hub{display:grid;grid-template-columns:1fr;gap:12px;margin:16px 0 2px}
.content-panel{min-width:0;padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:var(--shadow)}
.content-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:11px}
.content-heading{display:flex;align-items:center;gap:8px;min-width:0}
.content-symbol{width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 11%,var(--panel));color:var(--accent)}
.content-symbol svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.content-heading h2{font-size:13px;font-weight:900;margin:0}
.content-heading small{display:block;color:var(--muted);font-size:9px;margin-top:1px}
.content-more{border:0;background:transparent;color:var(--accent);font:800 10px "Cairo",sans-serif;white-space:nowrap;cursor:pointer;padding:6px}
.content-list{display:grid;gap:8px}
.content-item{padding:10px 11px;border-radius:13px;background:color-mix(in srgb,var(--accent) 4%,var(--panel));border:1px solid color-mix(in srgb,var(--line) 80%,transparent);min-width:0}
.content-item-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.content-item h3{font-size:11px;line-height:1.6;margin:0;font-weight:900;color:var(--text)}
.content-date{font-size:8px;color:var(--muted);white-space:nowrap}
.content-item p{font-size:10px;line-height:1.8;color:var(--muted);margin:0;overflow-wrap:anywhere}
.content-tag{display:inline-flex;align-items:center;padding:3px 7px;border-radius:20px;font-size:8px;font-weight:800;background:color-mix(in srgb,var(--accent) 10%,var(--panel));color:var(--accent);margin-top:6px}
.content-tag.alert{color:#b65a21;background:#fff0e4}.content-tag.maintenance{color:#8265d8;background:#f0ebff}
.content-empty{padding:15px 9px;text-align:center;border:1px dashed var(--line);border-radius:13px;color:var(--muted);font-size:10px;line-height:1.8}
.offer-item img{display:block;width:100%;max-height:135px;object-fit:cover;border-radius:10px;margin:0 0 8px;background:var(--line)}
.offer-action{display:inline-flex;margin-top:8px;padding:7px 10px;border-radius:9px;background:var(--accent);color:white;text-decoration:none;font-size:9px;font-weight:900}
.content-status{font-size:8px;color:var(--muted);margin-top:8px;text-align:left}
@media(min-width:700px){.content-hub{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}.content-panel{padding:15px}.content-item{padding:11px}}

@media(min-width:700px){body{padding-bottom:30px}.app{width:min(100% - 48px,760px);padding-top:25px}.hero{padding:35px 32px;margin:24px 0}.hero p{font-size:13px}.services{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.service{min-height:175px;align-items:flex-start;flex-direction:column;padding:18px}.service-icon{width:55px;height:55px}.service h3{font-size:16px}.service p{font-size:11px}.go{position:absolute;left:15px;bottom:15px}.support{padding:15px 18px}.sheet{width:min(100%,620px);left:50%;right:auto;transform:translate(-50%,105%);border-radius:24px 24px 0 0}.sheet.open{transform:translate(-50%,0)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* V21: customer help center */
.help-center{margin-top:18px}
.help-groups{display:grid;grid-template-columns:1fr;gap:12px}
.help-group{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:13px;box-shadow:var(--shadow);min-width:0}
.help-group-head{display:flex;align-items:center;gap:9px;margin-bottom:10px}

.help-group-head h3{font-size:13px;margin:0;font-weight:900}.help-group-head p{font-size:9px;color:var(--muted);margin:1px 0 0}
.help-list{display:grid;grid-template-columns:1fr;gap:8px}
.help-link{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:13px;color:var(--text);text-decoration:none;min-width:0;transition:border-color .2s,transform .2s;background:color-mix(in srgb,var(--panel) 94%,var(--bg))}
.help-link:hover{border-color:var(--accent)}.help-link:active{transform:scale(.99)}
.help-thumb{width:82px;height:54px;flex:none;border-radius:9px;background:color-mix(in srgb,var(--accent) 7%,var(--panel));display:grid;place-items:center}.youtube-thumb svg{width:43px;height:31px;display:block}
.help-copy{flex:1;min-width:0}.help-copy strong{display:block;font-size:10px;line-height:1.6}.help-copy small{display:block;color:var(--muted);font-size:8px;margin-top:2px}
.help-play{width:27px;height:27px;flex:none;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,#e53935 12%,var(--panel));color:#e53935;font-size:11px}
.help-download{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:9px;padding:10px;border-radius:12px;background:color-mix(in srgb,var(--support) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--support) 25%,var(--line));color:var(--support);font-size:10px;font-weight:900;text-decoration:none}
@media(min-width:700px){.help-groups{grid-template-columns:repeat(2,minmax(0,1fr))}.help-group:first-child{grid-column:1/-1}.help-group:first-child .help-list{grid-template-columns:repeat(2,minmax(0,1fr))}.help-group:first-child .help-link:last-child{grid-column:1/-1}}


/* V26: quiet update feedback and ambient audio control */
.header-action.sound-on{color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,var(--panel));position:relative}
.header-action.sound-off{color:#dc2626;position:relative}

<p class="quiet-intro">عداد بسيط يحفظ عدد تسبيحاتك على نفس الجهاز.</p>
<section class="quiet-card">
 <h2 id="tasbeehPhrase">سبحان الله</h2><div id="tasbeehCount" style="font-size:54px;font-weight:900;text-align:center;margin:18px 0;color:#15976b" aria-live="polite">0</div>
 <div style="height:8px;background:#e8f2ed;border-radius:20px;overflow:hidden"><span id="tasbeehProgress" style="display:block;height:100%;width:0;background:#15976b"></span></div>
 <div class="tasbeeh-targets" role="group" aria-label="اختيار هدف التسبيح" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:18px 0">
 <button type="button" class="tasbeeh-target-choice is-selected" data-target="33">33</button><button type="button" class="tasbeeh-target-choice" data-target="100">100</button><button type="button" class="tasbeeh-target-choice" data-target="300">300</button><button type="button" class="tasbeeh-target-choice" data-target="0">بدون هدف</button></div>
 <button type="button" id="tasbeehAdd" style="display:block;width:100%;padding:18px;border:0;border-radius:16px;background:#15976b;color:#fff;font-size:20px;font-weight:850">سبّح +1</button>
 <div style="display:flex;gap:10px;margin-top:12px"><button type="button" id="tasbeehChange" style="flex:1;padding:12px;border:1px solid #dcece4;border-radius:12px;background:#f7fcf9">تغيير الذكر</button><button type="button" id="tasbeehReset" style="flex:1;padding:12px;border:1px solid #dcece4;border-radius:12px;background:#f7fcf9">تصفير العداد</button></div>
 <p id="tasbeehStatus" style="font-size:12px;color:#698078;margin:14px 0 0" aria-live="polite">عدادك محفوظ على نفس الجهاز.</p></section></main><script>(()=>{const init=()=>{
const $=id=>document.getElementById(id),phrases=["سبحان الله","الحمد لله","الله أكبر","أستغفر الله","لا إله إلا الله","اللهم صلِّ وسلم على نبينا محمد","سبحان الله وبحمده","سبحان الله العظيم","لا حول ولا قوة إلا بالله","حسبي الله ونعم الوكيل","اللهم اغفر لي","رب اغفر لي وتب عليّ","اللهم أعني على ذكرك وشكرك وحسن عبادتك","اللهم إنك عفو تحب العفو فاعف عني"],key="connect_tasbeeh_state_v1";
let saved={count:0,target:33,phrase:0};try{saved={...saved,...JSON.parse(localStorage.getItem(key)||"{}")}}catch(e){}
let count=Math.max(0,Number(saved.count)||0),goal=[0,33,100,300].includes(Number(saved.target))?Number(saved.target):33,phrase=((Number(saved.phrase)||0)%phrases.length+phrases.length)%phrases.length;
const persist=()=>{try{localStorage.setItem(key,JSON.stringify({count,target:goal,phrase}))}catch(e){}};
const render=()=>{$("tasbeehCount").textContent=count.toLocaleString("en-US");$("tasbeehPhrase").textContent=phrases[phrase];$("tasbeehProgress").style.width=goal?Math.min(100,count/goal*100)+"%":"0%";document.querySelectorAll(".tasbeeh-target-choice").forEach(b=>b.classList.toggle("is-selected",Number(b.dataset.target)===goal));$("tasbeehStatus").textContent=count===0?"ابدأ بخطوة بسيطة؛ أحب الأعمال إلى الله أدومها وإن قلّ.":count%100===0?"ما شاء الله! أتممت "+count+" ذكرًا، استمر على وردك.":count%33===0?"أحسنت! وصلت إلى "+count+" تسبيحة، تقبّل الله منك.":goal&&count>=goal?"اكتمل هدفك، تقبّل الله منك واجعل لك وردًا ثابتًا.":goal?"باقي "+(goal-count)+" للوصول لهدفك، خذها بهدوء.":"استمر براحتك؛ كل ذكر خير، ولا تجعل العدد يشغلك عن حضور القلب."};
$("tasbeehAdd").addEventListener("click",()=>{count++;persist();render();if(navigator.vibrate)navigator.vibrate(8)});
document.querySelectorAll(".tasbeeh-target-choice").forEach(b=>b.addEventListener("click",()=>{goal=Number(b.dataset.target);persist();render()}));
$("tasbeehChange").addEventListener("click",()=>{phrase=(phrase+1)%phrases.length;persist();render()});
$("tasbeehReset").addEventListener("click",()=>{if(!confirm("هل تريد تصفير عداد التسبيح؟"))return;count=0;persist();render()});render()
};if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init,{once:true});else init()})();</script></body></html>
